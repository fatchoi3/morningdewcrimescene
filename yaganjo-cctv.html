<!DOCTYPE html>
<html lang="ko">
  <head>
    <link rel="icon" href="/favicon2.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>카메라 열람 — 야간조</title>
    <style>
      /* 새벽이슬 cctv.html 과 같은 뼈대지만 색과 부품이 다르다.
         저쪽은 「평면도 위 동선」 한 장면이고, 여기는 「통행 계수 로그」다.
         표가 주인공이라 표 서식에 가장 많은 줄이 들어간다. */
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px 16px 40px; background: #090c11; color: #dfe4ea;
             font-family: 'Noto Sans KR','Malgun Gothic','맑은 고딕', system-ui, sans-serif;
             -webkit-text-size-adjust: 100%; }
      .box { max-width: 560px; margin: 0 auto; }

      /* ── 머리 ─────────────────────────────────────────────────────────── */
      .hd { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
            padding-bottom: 11px; border-bottom: 1px solid #26313f; }
      .cam { font-size: 1.4rem; font-weight: 800; letter-spacing: .06em; color: #e8b23a; }
      .cname { font-size: 1.02rem; font-weight: 700; }
      .span { font-size: .88rem; color: #8b97a8; font-variant-numeric: tabular-nums; }
      .cardno { margin-left: auto; font-size: .7rem; font-weight: 800; letter-spacing: .1em;
                padding: 3px 9px; border-radius: 999px; border: 1px solid #3a4756; color: #9fb0c4; }
      .lens { margin: 9px 0 0; font-size: .82rem; line-height: 1.6; color: #93a2b4; }

      /* ── 도면 ─────────────────────────────────────────────────────────── */
      /* 사진이 아니라 도면이다. 1m = 3.5px 로 그렸고 치수 두 개와 축척 막대가 붙는다.
         좁은 화면에서 글자가 뭉개지지 않도록 최소 너비를 주고 가로로 밀어서 본다. */
      .planwrap { margin-top: 14px; border: 1px solid #26313f; border-radius: 10px;
                  background: #0e131a; overflow-x: auto; }
      .plan { display: block; width: 100%; min-width: 440px; height: auto; }
      .planfoot { margin: 8px 2px 0; font-size: .76rem; line-height: 1.7; color: #7e8b9b; }
      .planfoot b { color: #a8b6c6; font-weight: 700; }
      .planfoot .swipe { color: #c49a45; font-weight: 700; }
      .planfoot .swipe[hidden] { display: none; }

      /* ── 본문 ─────────────────────────────────────────────────────────── */
      .desc { margin: 16px 0 0; font-size: .92rem; line-height: 1.7; color: #b3bdc9; }
      .body p { margin: 14px 0 0; font-size: .96rem; line-height: 1.85; color: #cdd5de; }

      /* ── 통행 기록표 ──────────────────────────────────────────────────── */
      /* 누계 칸이 없다. 합계 줄도 없고 행 번호도 없다 — 세는 것은 앉은 사람의 일이다. */
      .log { width: 100%; border-collapse: collapse; margin: 16px 0 2px;
             font-variant-numeric: tabular-nums; }
      .log th { padding: 0 0 7px; font-size: .7rem; font-weight: 700; letter-spacing: .1em;
                color: #7e8b9b; text-align: left; border-bottom: 1px solid #2b3644; }
      .log td { padding: 10px 0; font-size: .95rem; line-height: 1.6; vertical-align: top;
                border-bottom: 1px solid #171f29; color: #cdd5de; }
      .log tr:last-child td { border-bottom: 0; }
      /* width:1% + nowrap = 「내용 너비만큼만」. 22:30~22:40 처럼 긴 구간이 와도
         칸이 늘어나지 옆 칸 글자와 붙지 않는다. */
      .log .t { width: 1%; white-space: nowrap; padding-right: 18px;
                font-weight: 800; color: #eef3f8; letter-spacing: .01em; }
      .log .d { width: 1%; white-space: nowrap; padding-right: 18px; }
      .log .w { white-space: nowrap; }
      .dir { display: inline-flex; align-items: baseline; gap: 5px;
             font-weight: 700; color: #aebbc9; }
      .dir b { font-size: 1.05em; color: #6f8399; }
      .chip { display: inline-block; padding: 2px 10px; border-radius: 999px;
              font-size: .82rem; font-weight: 700; }
      .chip.person { background: #142334; border: 1px solid #2d4b6e; color: #9cc5e9; }
      .chip.lift   { background: #2a2110; border: 1px solid #6a5120; color: #e8b23a; }

      /* ── 모니터(검은 화면) ────────────────────────────────────────────── */
      .mon { position: relative; aspect-ratio: 16 / 9; min-height: 160px; margin-top: 16px;
             background: #000; border: 1px solid #26313f; border-radius: 8px; overflow: hidden; }
      .mon img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .mon .ov { position: absolute; font-size: .74rem; letter-spacing: .12em;
                 font-variant-numeric: tabular-nums; }
      .mon .tag { top: 9px; left: 11px; color: #4a5865; font-weight: 700; }
      .mon .rec { top: 9px; right: 11px; color: #7a3a3a; font-weight: 700; }
      .mon .rec.on { color: #c24a4a; }
      .mon .tc  { bottom: 9px; right: 11px; color: #6e7d8c; font-size: .95rem; font-weight: 800; }
      .mon .aud { bottom: 10px; left: 11px; color: #3f4a56; }
      .bar { height: 3px; margin-top: 8px; border-radius: 2px; background: #1a222c; overflow: hidden; }
      .bar i { display: block; height: 100%; width: 0; background: #4a5a6b; }
      .ctl { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
      .ctl button { padding: 9px 15px; font: inherit; font-size: .85rem; font-weight: 700;
                    border-radius: 8px; border: 1px solid #33445a; background: #141c26;
                    color: #dfe4ea; cursor: pointer; }
      .ctl button:disabled { opacity: .45; cursor: default; }
      .ctl .hintx { font-size: .78rem; color: #6f7d8c; }

      /* ── 화면 캡처 ────────────────────────────────────────────────────── */
      .shot { margin: 16px 0 0; }
      .shot img { width: 100%; height: auto; display: block; border-radius: 8px;
                  border: 1px solid #26313f; }
      .shot.miss { display: flex; align-items: center; justify-content: center;
                   aspect-ratio: 16 / 9; border-radius: 8px; border: 1px dashed #2f3c4c;
                   background: #0d1218; color: #5d6b7a; font-size: .8rem; letter-spacing: .04em; }

      /* ── 04:11 이후 ───────────────────────────────────────────────────── */
      .after { margin-top: 20px; padding-top: 16px; border-top: 1px solid #26313f; }
      .after h2 { margin: 0; font-size: .98rem; font-weight: 800; color: #e8b23a;
                  letter-spacing: .02em; }
      .after[hidden] { display: none; }

      /* ── 꼬리말 · 안내 ────────────────────────────────────────────────── */
      .foot { margin-top: 22px; padding: 11px 13px; border-radius: 8px;
              background: #101821; border: 1px solid #26313f;
              font-size: .82rem; line-height: 1.75; color: #93a2b4; }
      .foot b { color: #d3dae2; font-weight: 700; }
      h1 { font-size: 1.2rem; margin: 0 0 12px; }
      .msg { font-size: .95rem; line-height: 1.8; }
      .sub { margin-top: 10px; font-size: .84rem; line-height: 1.7; color: #8b97a8; }
      code { background: #18212c; padding: 1px 6px; border-radius: 4px; font-size: .92em; }

      @media (prefers-reduced-motion: reduce) {
        .bar i { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="cctv-root"></div>
    <script type="module" src="/src/yaganjo/cctv/main.js"></script>
  </body>
</html>
