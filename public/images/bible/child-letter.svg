<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <!-- 종이 -->
  <rect x="14" y="10" width="292" height="180" rx="4" fill="#fdf6e3" stroke="#e6dcc0" stroke-width="2"/>
  <!-- 접힌 자국 -->
  <line x1="14" y1="100" x2="306" y2="100" stroke="#ece3c8" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 해 (크레용) -->
  <g stroke="#f1c40f" stroke-width="3" stroke-linecap="round">
    <circle cx="58" cy="46" r="14" fill="#ffe27a" stroke="#f1c40f"/>
    <line x1="58" y1="22" x2="58" y2="14"/><line x1="58" y1="78" x2="58" y2="70"/>
    <line x1="34" y1="46" x2="26" y2="46"/><line x1="90" y1="46" x2="82" y2="46"/>
    <line x1="40" y1="28" x2="34" y2="22"/><line x1="76" y1="64" x2="82" y2="70"/>
  </g>

  <!-- 집 -->
  <g>
    <rect x="232" y="48" width="50" height="40" fill="#f7c8a0" stroke="#d98e5a" stroke-width="2"/>
    <polygon points="228,48 286,48 257,24" fill="#e06b5a" stroke="#b94a3c" stroke-width="2"/>
    <rect x="250" y="66" width="14" height="22" fill="#9b6b3f"/>
  </g>

  <!-- 엄마 (큰 사람) -->
  <g stroke="#5aa0e0" stroke-width="3" stroke-linecap="round" fill="none">
    <circle cx="120" cy="116" r="12" fill="#ffd9b3" stroke="#e0a070"/>
    <line x1="120" y1="128" x2="120" y2="160"/>
    <line x1="120" y1="138" x2="104" y2="150"/>
    <line x1="120" y1="138" x2="150" y2="150"/>
    <line x1="120" y1="160" x2="108" y2="178"/>
    <line x1="120" y1="160" x2="132" y2="178"/>
  </g>
  <!-- 아이 (작은 사람) -->
  <g stroke="#e07ab0" stroke-width="3" stroke-linecap="round" fill="none">
    <circle cx="166" cy="130" r="9" fill="#ffd9b3" stroke="#e0a070"/>
    <line x1="166" y1="139" x2="166" y2="162"/>
    <line x1="166" y1="146" x2="150" y2="150"/>
    <line x1="166" y1="146" x2="178" y2="156"/>
    <line x1="166" y1="162" x2="158" y2="178"/>
    <line x1="166" y1="162" x2="176" y2="178"/>
  </g>
  <!-- 하트 -->
  <path d="M196 110 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0 q0 9 -12 18 q-12 -9 -12 -18 z" fill="#ff7b8a"/>

  <!-- 삐뚤빼뚤 글씨 -->
  <text x="150" y="40" font-family="Comic Sans MS, sans-serif" font-size="22" font-weight="700" fill="#5a7be0" transform="rotate(-4 150 40)">엄마 사랑해</text>
</svg>
