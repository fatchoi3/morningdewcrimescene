<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <!-- 펼친 일기장 -->
  <rect x="78" y="34" width="164" height="108" rx="6" fill="#2b323f" stroke="#3c4554" stroke-width="2"/>
  <!-- 가운데 접지선 -->
  <line x1="160" y1="38" x2="160" y2="138" stroke="#3c4554" stroke-width="2"/>
  <!-- 왼쪽 페이지 글줄 -->
  <g fill="#3c4554">
    <rect x="92" y="50" width="54" height="6" rx="3"/>
    <rect x="92" y="64" width="58" height="5" rx="2.5"/>
    <rect x="92" y="76" width="48" height="5" rx="2.5"/>
    <rect x="92" y="88" width="56" height="5" rx="2.5"/>
    <rect x="92" y="100" width="40" height="5" rx="2.5"/>
  </g>
  <!-- 오른쪽 페이지 글줄 (날짜 강조) -->
  <rect x="174" y="50" width="40" height="6" rx="3" fill="#4a90e2"/>
  <g fill="#3c4554">
    <rect x="174" y="64" width="56" height="5" rx="2.5"/>
    <rect x="174" y="76" width="50" height="5" rx="2.5"/>
    <rect x="174" y="88" width="56" height="5" rx="2.5"/>
    <rect x="174" y="100" width="44" height="5" rx="2.5"/>
  </g>
  <!-- 페이지 넘김 화살표 -->
  <g stroke="#9aa4b4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 88 l-10 0 m6 -6 l-6 6 l6 6"/>
    <path d="M262 88 l10 0 m-6 -6 l6 6 l-6 6"/>
  </g>
  <text x="160" y="166" font-family="sans-serif" font-size="12" fill="#9aa4b4" text-anchor="middle">화살표로 페이지를 넘겨 읽기</text>
</svg>
