# GitHub Pages 배포 — AWS 계정 없이 포크만으로 우리 팀 사이트를 갖고 싶을 때.
#
# 켜는 법 (포크한 쪽에서)
#   1) 저장소 Settings → Pages → Source 를 "GitHub Actions" 로.
#   2) Actions 탭에서 이 워크플로를 [Run workflow] 로 한 번 실행.
#   3) main 에 push 할 때마다 자동 배포하려면
#      Settings → Secrets and variables → Actions → Variables 에
#      ENABLE_PAGES = true 를 추가.
#
# 기본은 수동 실행만 한다 — S3(deploy.yml)로 배포하는 원 저장소에서
# 쓰지도 않는 워크플로가 매번 실패로 뜨지 않도록.
#
# 하위 경로 대응: configure-pages 가 알려주는 base_path 를 그대로 vite 에 넘긴다.
#   · 사용자 사이트(<계정>.github.io)  → base_path 가 비어 있어 루트 배포
#   · 프로젝트 사이트(<계정>.github.io/<저장소>) → '/<저장소>' 가 앞에 붙는다
name: GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 것은 취소하지 않는다(중간에 끊긴 사이트를 만들지 않도록).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 수동 실행이거나, ENABLE_PAGES 를 켜 둔 저장소에서만 돈다.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npx vite build
        env:
          # 프로젝트 사이트면 '/<저장소>', 사용자 사이트면 빈 값 → vite.config 가 '/' 로 보정
          VITE_BASE: ${{ steps.pages.outputs.base_path }}
          # 정답이 없는 공개 데모로 만들려면 아래 주석을 해제
          # VITE_DEMO: '1'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
