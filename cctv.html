<!DOCTYPE html>
<html lang="ko">
  <head>
    <link rel="icon" href="/favicon2.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>CCTV 열람 — 새벽이슬 크라임씬</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px; background: #0a0d12; color: #e6e2d8;
             font-family: 'Malgun Gothic', '맑은 고딕', system-ui, sans-serif; }
      .box { max-width: 520px; margin: 0 auto; }
      h1 { font-size: 1.25rem; margin: 0 0 10px; }
      .hd { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
      .tm { font-size: 1.5rem; font-weight: 800; color: #ffd24a; letter-spacing: .02em; }
      .lo { font-size: .85rem; color: #8b97a8; }
      .plan { width: 100%; height: auto; border-radius: 10px; border: 1px solid #24303f; display: block; }
      .who { margin-top: 12px; font-size: 1rem; font-weight: 700; line-height: 1.6; }
      .scene { margin-top: 6px; font-size: .92rem; line-height: 1.7; color: #b9b2a4; }
      .warn { margin-top: 16px; padding: 10px 12px; border-radius: 8px;
              background: #2a1a1a; border: 1px solid #7a4444; color: #d9b3b3;
              font-size: .84rem; line-height: 1.6; }
      .msg { font-size: .95rem; line-height: 1.7; }
      .sub { color: #8b97a8; font-size: .84rem; margin-top: 8px; }
      code { background: #1b2430; padding: 1px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="cctv-root"></div>
    <script type="module" src="/src/cctv/main.js"></script>
  </body>
</html>
