<!DOCTYPE html>
<html lang="ko">
  <head>
    <link rel="icon" href="/favicon2.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 진상 해설서(정답)가 들어 있다. 참가자에게 노출될 이유가 없으므로 색인 차단. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>보드게임 인쇄물 — 야간조</title>
    <style>
      /* 새벽이슬 board.html 과 같은 뼈대. 색만 야간조다 —
         한 기기에서 두 판을 번갈아 뽑을 때 「어느 판을 뽑고 있는지」가 한눈에 보여야 한다. */
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px 20px 64px; background: #eceef2; color: #14171c;
             font-family: 'Noto Sans KR','Malgun Gothic', '맑은 고딕', system-ui, sans-serif; }
      #board-root { max-width: 640px; margin: 0 auto; }
      h1 { font-size: 1.6rem; margin: 0 0 6px; }
      .sub { color: #666c78; font-size: .92rem; margin: 0 0 22px; }
      .how { background: #f8f9fb; border: 1px solid #d7dbe2; border-radius: 12px;
             padding: 14px 18px; font-size: .88rem; line-height: 1.7; margin-bottom: 22px; }
      .how ul { margin: 8px 0 0; padding-left: 18px; }
      .how li { margin-bottom: 4px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 14px;
             background: #fff; border: 1px solid #d7dbe2; border-radius: 12px;
             padding: 14px 16px; margin-bottom: 10px; }
      .row.spoil { border-color: #c79a9a; background: #fbf5f5; }
      .fn { font-weight: 800; font-size: .98rem; }
      .nt { color: #666c78; font-size: .82rem; margin-top: 3px; line-height: 1.5; }
      button { background: #14171c; color: #fff; border: 0; border-radius: 9px;
               padding: 10px 16px; font-size: .88rem; font-weight: 700; cursor: pointer;
               white-space: nowrap; font-family: inherit; }
      button:hover { background: #343a45; }
      button:disabled { opacity: .55; cursor: default; }
      .row.spoil button { background: #93373b; }
      .all { width: 100%; margin: 0 0 14px; padding: 16px; font-size: 1rem; }
      .one { background: #666c78; padding: 8px 14px; font-size: .82rem; }
      .prog { margin: -4px 0 18px; }
      .bar { height: 6px; background: #d7dbe2; border-radius: 3px; overflow: hidden; }
      .bar i { display: block; height: 100%; width: 0; background: #14171c; transition: width .2s; }
      .pmsg { font-size: .8rem; color: #666c78; margin-top: 6px; }
      /* QR 주소는 한 번 뽑으면 되돌릴 수 없다 — 어디를 가리키는지 늘 보이게 둔다. */
      .qrhost { background: #f8f9fb; border: 1px solid #d7dbe2; border-radius: 10px;
                padding: 10px 14px; font-size: .82rem; color: #444a55; margin-bottom: 14px; line-height: 1.6; }
      /* 생성기가 스스로 잡아낸 문제(제작 주석 누출 · QR 누락 · 인쇄 함정) */
      .warn { background: #fdf8ec; border: 1px solid #d8c08a; border-radius: 12px;
              padding: 12px 16px; font-size: .84rem; color: #6b5a2c; line-height: 1.65; margin-bottom: 18px; }
      .warn b { display: block; margin-bottom: 6px; }
      .warn ul { margin: 0; padding-left: 18px; }
      .foot { color: #868d9a; font-size: .82rem; margin-top: 20px; }
      code { background: #dfe3ea; padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="board-root"></div>
    <script type="module" src="/src/yaganjo/board/main.js"></script>
  </body>
</html>
